<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: var(--figma-color-bg, #ffffff);
      --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
      --text: var(--figma-color-text, #1e1e1e);
      --text-2: var(--figma-color-text-secondary, #6b6b6b);
      --border: var(--figma-color-border, #e6e6e6);
      --brand: var(--figma-color-bg-brand, #0d6efd);
      --brand-hover: var(--figma-color-bg-brand-hover, #0b5ed7);
      --on-brand: var(--figma-color-text-onbrand, #ffffff);
      --danger: var(--figma-color-text-danger, #d93025);
      --success: var(--figma-color-text-success, #188038);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font: 12px/1.45 Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
    .subtitle { color: var(--text-2); margin: 0 0 16px; }
    label { display: block; font-weight: 500; margin: 12px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
    textarea { font-family: ui-monospace, Menlo, Consolas, monospace; min-height: 70px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row > .grow { flex: 1; }
    .row > .method { width: 92px; flex: none; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      color: var(--on-brand);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--brand-hover); }
    button:disabled { opacity: .6; cursor: progress; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
      font-weight: 500;
    }
    details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
    summary { cursor: pointer; color: var(--text-2); font-weight: 500; }
    #status {
      margin-top: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--bg-2);
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 34px;
    }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--success); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>JSON Dashboard</h1>
  <p class="subtitle">Consulta un servidor interno a través del proxy local y genera un dashboard en el lienzo.</p>

  <form id="form" autocomplete="off">
    <label for="targetUrl">URL del servidor interno</label>
    <div class="row">
      <select id="method" class="method" aria-label="Método HTTP">
        <option>GET</option>
        <option>POST</option>
      </select>
      <input id="targetUrl" class="grow" list="history" type="text" required
             placeholder="http://192.168.28.130/reng/servlet/..." />
    </div>
    <datalist id="history"></datalist>

    <div id="bodyWrap" class="hidden">
      <label for="body">Cuerpo JSON (opcional)</label>
      <textarea id="body" placeholder='{"param": "valor"}'></textarea>
    </div>

    <label for="title">Título del dashboard (opcional)</label>
    <input id="title" type="text" placeholder="Se usa el último segmento de la URL si se deja vacío" />

    <details>
      <summary>Configuración avanzada</summary>
      <label for="proxyUrl">URL del proxy local</label>
      <input id="proxyUrl" type="text" value="http://localhost:5000/api/proxy" />
      <label for="timeout">Timeout (segundos)</label>
      <input id="timeout" type="number" min="1" max="120" value="15" />
      <button type="button" id="health" class="secondary">Probar conexión con el proxy</button>
    </details>

    <button type="submit" id="submit">Obtener Datos</button>
  </form>

  <div id="status" role="status">Listo.</div>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('form');
    const submitBtn = $('submit');
    const statusEl = $('status');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function post(msg) {
      parent.postMessage({ pluginMessage: msg }, '*');
    }

    $('method').addEventListener('change', () => {
      $('bodyWrap').classList.toggle('hidden', $('method').value !== 'POST');
    });

    // Probar /api/health del proxy
    $('health').addEventListener('click', async () => {
      const healthUrl = $('proxyUrl').value.trim().replace(/\/api\/proxy\/?$/, '/api/health');
      setStatus('Probando ' + healthUrl + ' …');
      try {
        const res = await fetch(healthUrl);
        const json = await res.json();
        setStatus('Proxy OK. Redes permitidas: ' + JSON.stringify(json.allowed_networks), 'ok');
      } catch (err) {
        setStatus('No se pudo contactar el proxy. ¿Ejecutaste "python server.py"?\n' + err.message, 'error');
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const targetUrl = $('targetUrl').value.trim();
      const proxyUrl = $('proxyUrl').value.trim();
      const method = $('method').value;

      if (!/^https?:\/\//i.test(targetUrl)) {
        setStatus('La URL debe comenzar con http:// o https://', 'error');
        return;
      }

      const payload = {
        target_url: targetUrl,
        method,
        timeout: Number($('timeout').value) || 15,
      };

      if (method === 'POST' && $('body').value.trim()) {
        try {
          payload.body = JSON.parse($('body').value);
        } catch (err) {
          setStatus('El cuerpo no es JSON válido: ' + err.message, 'error');
          return;
        }
      }

      submitBtn.disabled = true;
      setStatus('Consultando ' + targetUrl + ' …');

      try {
        const res = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        let json;
        try {
          json = await res.json();
        } catch (_) {
          throw new Error('El proxy devolvió una respuesta no JSON (HTTP ' + res.status + ').');
        }

        if (!res.ok || !json.ok) {
          const e = json.error || {};
          let msg = '[' + (e.code || res.status) + '] ' + (e.message || 'Error desconocido');
          if (e.preview) msg += '\n\nVista previa:\n' + e.preview.slice(0, 200);
          throw new Error(msg);
        }

        setStatus('Respuesta HTTP ' + json.status_code + ' en ' + json.elapsed_ms + ' ms. Dibujando…', 'ok');
        post({ type: 'save-history', url: targetUrl });
        post({
          type: 'render-json',
          data: json.data,
          meta: {
            url: json.target_url || targetUrl,
            method,
            status: json.status_code,
            elapsedMs: json.elapsed_ms,
            title: $('title').value.trim(),
          },
        });
      } catch (err) {
        const isNetwork = err instanceof TypeError; // fetch() falla con TypeError si no hay conexión/CORS
        setStatus(
          isNetwork
            ? 'No se pudo conectar con el proxy en ' + proxyUrl + '.\nVerifica que el servidor Python esté corriendo.'
            : err.message,
          'error'
        );
        submitBtn.disabled = false;
      }
    });

    // Mensajes desde code.js
    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'history') {
        $('history').innerHTML = '';
        for (const url of msg.items) {
          const opt = document.createElement('option');
          opt.value = url;
          $('history').appendChild(opt);
        }
        if (!$('targetUrl').value && msg.items[0]) $('targetUrl').value = msg.items[0];
      } else if (msg.type === 'render-done') {
        submitBtn.disabled = false;
        setStatus('Dashboard generado: ' + msg.stats.nodes + ' elementos.', 'ok');
      } else if (msg.type === 'render-error') {
        submitBtn.disabled = false;
        setStatus('Error al dibujar: ' + msg.message, 'error');
      }
    };

    $('targetUrl').focus();
  </script>
</body>
</html>
